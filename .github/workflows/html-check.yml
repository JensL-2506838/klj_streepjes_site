name: HTML Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-check:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML files
        run: |
          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -print0 |
          xargs -0 -r npx --yes html-validate