{% extends "base.html" %}
{% block title %}newEvent{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">New event</h1>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form action="{{ url_for('newEvent') }}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="title">Title:</label>
                    <input class="form-control form-control-lg" type="text" id="title" name="title">
                </div>

                <div class="mb-4">
                    <label class="form-label" for="price">Price:</label>
                    <input class="form-control form-control-lg" type="number" id="price" name="price" value="{{ standardPrice }}">
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">Add event</button>
            </form>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    {% for message in alertMessages %}
        <script>
            alert({{ message | tojson }});
        </script>
    {% endfor %}
{% endblock %}
