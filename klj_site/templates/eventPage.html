<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EventPage</title>
</head>
<body>
    <h1>event page</h1>
    <h2>
        {{ event_name }} - Price: {{ event_price }}
        {% if not user_is_participant %}
            <a href="{{ url_for('participate', event_name=event_name) }}">
                <button type="button">Participate</button>
            </a>
        {% endif %}
    </h2>

    <ul>
        {% for participant in participants %}
            <li>
                {{ participant['username'] }}
                <a href="{{ url_for('decrease_drink_counter', event_name=event_name, user_id=participant['id']) }}">
                    <button type="button">-</button>
                </a>
                {{ participant['amount'] }}
                <a href="{{ url_for('increase_drink_counter', event_name=event_name, user_id=participant['id']) }}">
                    <button type="button">+</button>
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
