{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
    <div class="pt-4">
        <h1 class="h2 fw-bold text-center mb-4">🍺 Streepjes</h1>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">Register</h2>
                <form action="{{ url_for('register') }}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username:</label>
                        <input class="form-control form-control-lg" type="text" id="username" name="username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password:</label>
                        <input class="form-control form-control-lg" type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit">Register</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    {% for message in alertMessages %}
        <script>
            alert({{ message | tojson }});
        </script>
    {% endfor %}
{% endblock %}
